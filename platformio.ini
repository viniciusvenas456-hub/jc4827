[env:jc4827w543]
platform = espressif32 @ 6.5.0
board = esp32-s3-devkitc-1
framework = arduino

; Configuração EXATA de memória extraída do seu JSON (Evita o Boot Loop!)
board_build.arduino.memory_type = qio_opi
board_build.flash_mode = qio
board_upload.flash_size = 4MB
board_upload.maximum_size = 4194304
board_build.partitions = huge_app.csv
board_build.f_cpu = 240000000L
board_build.f_flash = 80000000L

build_flags = 
    -DBOARD_HAS_PSRAM
    -DARDUINO_USB_CDC_ON_BOOT=1
    -DLV_CONF_INCLUDE_SIMPLE
    -DLV_COLOR_16_SWAP=1
    -DLV_MEM_CUSTOM=1
    -DLV_FONT_MONTSERRAT_12=1
    -DLV_FONT_MONTSERRAT_14=1
    -DLV_FONT_MONTSERRAT_16=1
    -DLV_FONT_MONTSERRAT_20=1
    -DLV_FONT_MONTSERRAT_24=1
    -I include
    -I src

lib_deps =
    lvgl/lvgl @ ^8.3.11
    https://github.com/moononournation/Arduino_GFX.git#v1.4.7
    bblanchon/ArduinoJson @ ^7.0.4
    https://github.com/tamctec/gt911-arduino.git
